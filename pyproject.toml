[project]
name = "loom"
version = "0.1.0"
description = "Implicit neural renderer for parameterising neural network weights as low-dimensional manifolds"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ammar Tarajia" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.10.0",
    "jax-tqdm>=0.4.0",
    "jaxtyping>=0.3.9",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "optax>=0.2.8",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
    "pre-commit",
    "bandit",
]

[project.urls]
Homepage = "https://github.com/DarkbyteAT/loom"
Repository = "https://github.com/DarkbyteAT/loom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
