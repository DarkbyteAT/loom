[project]
name = "loom"
version = "0.1.0"
description = "A substrate for re-parameterising JAX pytrees by the output of arbitrary functions, in a way that is scannable and optimisable"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ammar Tarajia" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.10.0",
    "jaxtyping>=0.3.9",
]

[project.optional-dependencies]
# `ondes` is required by example renderers and the test suite, not by the
# library itself — install with `loom[examples]` to get INR primitives.
examples = ["ondes"]

# For local co-development against a checkout of ondes, swap this for:
#   ondes = { path = "../ondes", editable = true }
# Refresh after switching with `uv sync --reinstall`.
[tool.uv.sources]
ondes = { git = "https://github.com/DarkbyteAT/ondes.git" }

[dependency-groups]
dev = [
    "loom[examples]",
    "pyright",
    "pytest",
    "ruff",
    "pre-commit",
    "bandit",
]

[project.urls]
Homepage = "https://github.com/DarkbyteAT/loom"
Repository = "https://github.com/DarkbyteAT/loom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
